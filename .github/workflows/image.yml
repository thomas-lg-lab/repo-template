# Builds the Docker image on every PR (no push), and publishes it to GHCR.
# Merging is not releasing:
#   - a push to main publishes :edge and :sha-<short>
#   - a version tag v* (a published release) publishes :latest and :X.Y.Z / :X.Y / :X
# A tag pushed by a person triggers `push`; a release published by draft-release.yml creates its
# tag with GITHUB_TOKEN, which starts no workflow, so that job dispatches this one on the tag.
#
# Delete this file if the project ships no image. If it does, keep `docker-build` among the
# required checks of the main ruleset (.github/rulesets/main.json).
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # hashFiles() is not available in a job-level `if`, so a first job looks for the Dockerfile.
  # A skipped required check counts as passed, so a repository without an image stays mergeable.
  detect:
    runs-on: ubuntu-latest
    outputs:
      dockerfile: ${{ steps.check.outputs.dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: echo "dockerfile=$([ -f Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: detect
    if: needs.detect.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for the build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
      # Build once, load it, and gate on it before anything is pushed. amd64 only here: `load`
      # takes one platform, and both architectures install the same packages.
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fail on a fixable CRITICAL only: HIGHs churn with the vulnerability database and would
      # wedge releases on base-image findings outside the project's control.
      - name: Vulnerability gate (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
      - id: push
        if: github.event_name != 'pull_request'
        name: Push (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      # Verifiable with: gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
      - if: github.event_name != 'pull_request'
        name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
