# Keeps a draft GitHub Release up to date from merged PRs (categorised by their
# conventional-commit labels, see release-drafter.yml). Pushing to main updates
# the draft; a manual run publishes it, which creates the `v*` tag that
# image.yml watches to build + push the versioned GHCR image.
name: Draft Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (do not publish the release)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# Nothing at workflow level: each job asks for what it needs.
permissions: {}

# Rapid pushes to main both rewrite the same draft release, queue them instead
# of letting two drafter runs race (no cancel: a publish run must never be killed
# mid-flight).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write # create and update the draft release
      pull-requests: read
    steps:
      - name: Create/Update Draft Release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        with:
          config-name: release-drafter.yml
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # publish the release, which creates the tag
      pull-requests: read
      actions: write # dispatch image.yml on the tag a publish creates
    steps:
      - name: Publish Release
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7
        with:
          config-name: release-drafter.yml
          publish: ${{ github.event.inputs.dry_run == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
        id: drafter
      # The tag this publish created was pushed with GITHUB_TOKEN, which starts no
      # workflow, so image.yml would never see it. Dispatch it on the tag instead.
      - name: Build and push the release image
        if: github.event.inputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.drafter.outputs.tag_name }}
        run: gh workflow run image.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
