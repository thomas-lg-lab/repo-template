# Release notes: a push to main refreshes the draft release from the merged PRs' labels; a manual run publishes it,
# which creates the `v*` tag and dispatches ci.yml on it to build the release image. Shared workflow and
# configuration of thomas-lg-lab/.github.
name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would be published, change nothing
        type: boolean
        default: false

permissions: {}

# Two drafter runs would race on the same draft. No cancel: a publish must never be killed mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: read
      actions: write
    uses: thomas-lg-lab/.github/.github/workflows/release-drafter.yml@d9afae53e09ac73945d6053dcf12e9b1d2bb24aa # v1.1.0
    with:
      publish: ${{ github.event_name == 'workflow_dispatch' }}
      dry-run: ${{ inputs.dry-run == true }}
      image-workflow: ci.yml
