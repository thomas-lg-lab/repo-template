# The organisation's PR conventions: Conventional Commit title (required check `conventions / title`) and the
# label it implies. Shared workflow of thomas-lg-lab/.github.
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: write
      security-events: write # zizmor's SARIF upload
    uses: thomas-lg-lab/.github/.github/workflows/pr-conventions.yml@8622237a562b32f35b9da7ae7a9cb7c3ab08a0a9 # v1.5.0
