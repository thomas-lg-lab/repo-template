# The organisation's PR conventions: Conventional Commit title (required check `conventions / title`) and the
# label it implies. Shared workflow of thomas-lg-lab/.github.
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: write
      security-events: write # zizmor's SARIF upload
    uses: thomas-lg-lab/.github/.github/workflows/pr-conventions.yml@85dd5f52209e73b88ba0a57ae7847a662072f9d1 # v1.4.0
