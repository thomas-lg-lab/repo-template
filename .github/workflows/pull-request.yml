# The organisation's PR conventions: Conventional Commit title (required check `conventions / title`) and the
# label it implies. Shared workflow of thomas-lg-lab/.github.
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventions:
    permissions:
      contents: read
      pull-requests: write
