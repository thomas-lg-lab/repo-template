name: Feature request
description: A new capability or a change to an existing one.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen. Configuration, CLI or UI sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds in use, other designs, why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Additional context
